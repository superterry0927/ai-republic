<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI共和國1.0｜互動闖關</title><meta name="theme-color" content="#09152e"><style>body{background:#081428;color:#ebf9ff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;text-align:center;padding:16vh 20px}h1{font-size:28px}.spin{font-size:44px;margin-bottom:22px}</style></head><body><div class="spin">🪐</div><h1>AI共和國 1.0</h1><p id="progress">正在載入完整地圖與題目圖片...</p><script>(async()=>{try{const n=10,a=[];for(let i=1;i<=n;i++)a.push("pieces/part-"+String(i).padStart(3,"0")+".txt");const t=await Promise.all(a.map(async (p,i)=>{const r=await fetch(p);if(!r.ok)throw Error(p+" HTTP "+r.status);document.getElementById("progress").textContent="正在準備遊戲素材 "+(i+1)+"/"+n;return r.text()}));document.open();document.write(t.join(""));document.close()}catch(e){document.getElementById("progress").textContent="載入遇到問題："+e.message+"。請重新整理頁面，或確認網路連線。"}})();</script></body></html>
