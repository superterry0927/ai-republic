<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0c1734"><title>AI共和國1.0｜互動闖關</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1f427a,#0b1632 55%,#080b1c);min-height:100vh;color:#f5f9ff;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}button,textarea,input{font:inherit}button{cursor:pointer}.wrap{max-width:970px;margin:auto;padding:18px 16px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.tag{background:#153962;border:1px solid #4079b7;color:#bfe9ff;border-radius:40px;padding:6px 12px;font-size:13px}h1{font-size:clamp(24px,5vw,40px);margin:10px 0 2px}h2{font-size:21px}p{margin:8px 0}.lead{color:#bad0e9}.card{border:1px solid #385785;background:#102244ed;padding:18px;border-radius:20px;margin-top:18px;box-shadow:0 15px 40px #0002}.map{background:radial-gradient(ellipse at center,#1c5590,#0e254d 65%);border:1px solid #4f8cbf;border-radius:18px;margin:14px 0;padding:18px;text-align:center}.planet{font-size:68px;filter:drop-shadow(0 0 16px #3bd0ff)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.zone{background:linear-gradient(155deg,#274d84,#182c55);padding:18px 10px;border:1px solid #4772a3;color:white;border-radius:14px;text-align:center;min-height:135px}.zone .icon{display:block;font-size:34px}.zone small{display:block;color:#bacde9;font-size:12px}.zone:hover,.zone:focus-visible,.task:hover{outline:2px solid #73deff}.tasks{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:10px}.task{background:#152e55;border:1px solid #426b9f;padding:15px;border-radius:13px;color:white;text-align:left}.task b,.task small{display:block}.task small{color:#a9c5e9}.done{border-color:#49c7ac!important}.btn{background:#44caff;color:#071b36;border:0;border-radius:12px;font-weight:750;padding:11px 15px}.back{background:#244a77;color:white;border:1px solid #477aad;border-radius:12px;padding:11px 15px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}textarea,input{width:100%;padding:12px;border-radius:12px;color:white;background:#0b1933;border:1px solid #5480b3;min-height:50px}textarea{min-height:140px;resize:vertical}.notice{border-left:4px solid #ffd266;padding:13px;background:#473d2880;border-radius:8px;color:#ffe9bc}.muted{color:#aac6e5;font-size:13px}.hidden{display:none}a{color:#8fe9ff}footer{color:#a9bbd4;font-size:12px;margin-top:30px}@media(max-width:500px){.card{padding:13px}.planet{font-size:55px}.grid{grid-template-columns:repeat(2,1fr)}.zone{min-height:125px}}</style></head><body><div class="wrap"><header class="top"><div><div class="tag">數位素養 × 解謎闖關</div><h1>🌐 AI 共和國 1.0</h1><div class="lead">核心系統修復計畫｜31 個任務・5 大主題</div></div><div class="tag" id="counter">0 / 31 份草稿</div></header><main id="app"></main><footer>手機／iPad／電腦版 · 預覽階段資料僅儲存於此瀏覽器，尚未連線 Firebase · 請勿輸入學生真實姓名</footer></div><script>const DATA={"worlds":[{"id":1,"name":"記憶迴廊","subtitle":"數位足跡之謎","map":2,"color":"#38c9ff","icon":"🧠"},{"id":2,"name":"多巴胺迴圈","subtitle":"網路成癮的挑戰","map":3,"color":"#25d4ce","icon":"⏳"},{"id":3,"name":"信任裂痕","subtitle":"數位性剝削的陷阱","map":4,"color":"#dda1ff","icon":"🛡️"},{"id":4,"name":"偏見迷霧","subtitle":"網路偏見與歧視","map":5,"color":"#cafa6e","icon":"🔎"},{"id":5,"name":"速食影像","subtitle":"短影音識讀風暴","map":6,"color":"#ffc467","icon":"🎞️"}],"questions":[{"id":"1-1","world":1,"pages":[7],"title":"記憶中的四位密碼","mode":"exact","notes":"四位數字密碼；請教師核對後設定正解","external":null},{"id":"1-2","world":1,"pages":[8],"title":"時間膠卷的字母謎題","mode":"exact","notes":"文字／數字；請教師提供正解","external":null},{"id":"1-3","world":1,"pages":[9],"title":"晶晶害怕的文字謎題","mode":"exact","notes":"文字謎題；請教師提供正解","external":null},{"id":"1-4","world":1,"pages":[10],"title":"照片會說話：EXIF","mode":"review","notes":"上傳校園風景照片並解釋 EXIF 隱私資訊","external":null},{"id":"1-5","world":1,"pages":[11,12],"title":"找出不該公開的個資","mode":"review","notes":"判斷數位檔案中有哪些個資不應公開","external":null},{"id":"1-6","world":1,"pages":[13],"title":"協助晶晶冷靜發文","mode":"review","notes":"小組討論及文字反思","external":null},{"id":"2-1","world":2,"pages":[14],"title":"多巴胺迴圈時鐘","mode":"exact","notes":"找出缺少的時鐘時間","external":null},{"id":"2-2","world":2,"pages":[15,16],"title":"45 秒找到登出鍵","mode":"timed","notes":"限時互動＋反思","external":null},{"id":"2-3","world":2,"pages":[17],"title":"時間都去哪了","mode":"review","notes":"應用程式使用時間與心情紀錄","external":null},{"id":"2-4","world":2,"pages":[18,19],"title":"生活絲帶與自我控制","mode":"review","notes":"圖形上下順序＋四字詞語，正式版應分為兩步驟","external":null},{"id":"2-5","world":2,"pages":[20],"title":"旋轉密碼紙條","mode":"exact","notes":"轉碼型文字／數字答案","external":null},{"id":"2-6","world":2,"pages":[21],"title":"無手機下午","mode":"review","notes":"規劃三項不使用電子產品的活動","external":null},{"id":"3-1","world":3,"pages":[22],"title":"以太野狼的數列密碼","mode":"exact","notes":"數列規律","external":null},{"id":"3-2","world":3,"pages":[23],"title":"完美偽裝：照片判讀","mode":"select","notes":"選出照片並說明理由","external":null},{"id":"3-3","world":3,"pages":[24],"title":"破解遺失的 E 代碼","mode":"exact","notes":"推論缺少的數字","external":null},{"id":"3-4","world":3,"pages":[25,26],"title":"蒐證步驟與支持朋友","mode":"review","notes":"步驟排序＋支持性文字，正式版應分為兩步驟","external":null},{"id":"3-5","world":3,"pages":[27],"title":"守護者熱線","mode":"review","notes":"查詢處理兒少網路性剝削的求助機構","external":null},{"id":"3-6","world":3,"pages":[28],"title":"數一數魔力正方形","mode":"exact","notes":"圖片計數","external":null},{"id":"4-1","world":4,"pages":[29],"title":"觀點切換器","mode":"review","notes":"分析 AI 寫作業的正反觀點","external":null},{"id":"4-2","world":4,"pages":[30],"title":"演算法的牆","mode":"external","notes":"外部演算法體驗＋反思","external":"https://superterry0927.github.io/bubble/"},{"id":"4-3","world":4,"pages":[31],"title":"抽絲剝繭：隱藏數字","mode":"exact","notes":"觀察圖像中的數字","external":null},{"id":"4-4","world":4,"pages":[32],"title":"假新聞偵探","mode":"external","notes":"外部新聞畫重點系統＋可疑之處","external":"https://superterry0927.github.io/news-highlighter/"},{"id":"4-5","world":4,"pages":[33],"title":"查證數字規律","mode":"exact","notes":"計算題","external":null},{"id":"4-6","world":4,"pages":[34],"title":"看見真相","mode":"exact","notes":"四字詞語","external":null},{"id":"5-1","world":5,"pages":[35],"title":"兔子洞效應","mode":"review","notes":"探究推薦演算法與因應方法","external":null},{"id":"5-2","world":5,"pages":[36],"title":"無形戰爭：影片查核","mode":"select","notes":"真假判斷＋說明證據","external":null},{"id":"5-3","world":5,"pages":[37],"title":"Q 版貼圖製造機","mode":"external","notes":"外部貼圖生成＋成果提交","external":"https://superterry0927.github.io/AI-STICKER/"},{"id":"5-4","world":5,"pages":[38],"title":"真假影片大挑戰","mode":"review","notes":"四段影片辨識及證據；來源連結待補","external":null},{"id":"5-5","world":5,"pages":[39],"title":"三角形魔方陣","mode":"exact","notes":"圖形數字規律","external":null},{"id":"5-6","world":5,"pages":[40],"title":"演算法風扇密碼","mode":"exact","notes":"圖形數列規律","external":null},{"id":"FINAL","world":0,"pages":[41],"title":"最終關：素養解藥","mode":"exact","notes":"最後的四字密碼","external":null}]};const DBKEY='ai-republic-1.0-preview-v2';let saved={};try{saved=JSON.parse(localStorage.getItem(DBKEY)||'{}')||{}}catch(e){}let world=null,task=null;const esc=s=>String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const app=document.getElementById('app');function update(){document.getElementById('counter').textContent=Object.values(saved).filter(Boolean).length+' / 31 份草稿';localStorage.setItem(DBKEY,JSON.stringify(saved))}function home(){world=null;task=null;app.innerHTML='<div class="card"><div class="map"><div class="planet">🪐 ✨ 🧑‍🚀</div><h2>歡迎來到 AI 共和國</h2><p>跟著晶晶穿越五個知識區域，修復共和國的核心系統！</p><p class="muted">原版插畫地圖與題目圖片尚待素材上傳，此版先開放完整任務目錄與作答暫存。</p></div><h2>選擇挑戰區域</h2><div class="grid">'+DATA.worlds.map(w=>'<button class="zone" data-world="'+w.id+'"><span class="icon">'+w.icon+'</span><b>'+esc(w.name)+'</b><small>'+esc(w.subtitle)+'</small></button>').join('')+'</div><div class="actions"><button class="back" data-final="1">🏁 FINAL 最終關卡</button></div></div>';document.querySelectorAll('[data-world]').forEach(b=>b.onclick=()=>showWorld(+b.dataset.world));document.querySelector('[data-final]').onclick=()=>showTask('FINAL');update()}function showWorld(id){world=id;task=null;let w=DATA.worlds.find(x=>x.id===id);app.innerHTML='<div class="actions"><button class="back" id="home">← 返回地圖</button></div><div class="card"><h2>'+w.icon+' '+esc(w.name)+'</h2><p class="lead">'+esc(w.subtitle)+'</p><div class="tasks">'+DATA.questions.filter(q=>q.world===id).map(q=>'<button class="task '+(saved[q.id]?'done':'')+'" data-task="'+q.id+'"><b>'+q.id+'　'+esc(q.title)+'</b><small>'+(saved[q.id]?'📝 已保存作答草稿':'👉 開始任務')+'</small></button>').join('')+'</div></div>';document.getElementById('home').onclick=home;document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>showTask(b.dataset.task));update()}function showTask(id){task=DATA.questions.find(q=>q.id===id);if(!task)return;app.innerHTML='<div class="actions"><button class="back" id="back">← 返回關卡列表</button><button class="back" id="home">⌂ 回地圖</button></div><section class="card"><div class="tag">'+esc(task.id)+' · '+esc(task.mode)+'</div><h2>'+esc(task.title)+'</h2><p class="lead">'+esc(task.notes)+'</p><p class="muted">原 PDF 頁面：'+task.pages.join('、')+'</p><div class="notice">📷 此任務的原題圖片尚未同步到網站，請暫時搭配原 PDF 使用；正式版會恢復圖像與完整互動。</div>'+(task.external?'<p><a href="'+encodeURI(task.external)+'" target="_blank" rel="noopener">↗ 開啟原題外部互動工具</a></p>':'')+'<label for="answer"><h2>✏️ 小隊作答區</h2></label><textarea id="answer" placeholder="記錄觀察、答案或小組討論……">'+esc(saved[id]||'')+'</textarea><p class="muted">目前只保存作答，尚未啟用後台答案檢核及教師審核。</p><div class="actions"><button class="btn" id="save">儲存作答草稿</button><button class="back" id="clear">清除本題草稿</button></div><p id="feedback" aria-live="polite"></p></section>';document.getElementById('home').onclick=home;document.getElementById('back').onclick=()=>id==='FINAL'?home():showWorld(task.world);document.getElementById('save').onclick=()=>{saved[id]=document.getElementById('answer').value.trim();update();document.getElementById('feedback').textContent='✅ 已儲存在這台裝置的瀏覽器（尚未送交教師）'};document.getElementById('clear').onclick=()=>{delete saved[id];update();document.getElementById('answer').value='';document.getElementById('feedback').textContent='已清除草稿'}}home();</script></body></html>
